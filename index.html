<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>탭샵바 People</title>
<meta name="theme-color" content="#4A0B18">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSB People">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --wine:#4A0B18;--wine2:#6E1426;--wine3:#3A0812;--navy:#141B33;--rose:#C99A9E;--rose-l:#F3E4E3;
  --grey:#F1F1EF;--line:#ECE6E3;--yellow:#FFC100;--cream:#FFFDFC;--ink:#0E0E0E;--mute:#8A7F80;--blue:#156DFF;
  --ok:#1F8A5B;--warn:#C27A00;--bad:#C2283A;
  --r:20px;--sh:0 1px 2px rgba(20,27,51,.04),0 6px 24px rgba(74,11,24,.07);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#2a0610}
body{background:var(--cream)}
html,body{margin:0;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--safe-b));position:relative}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-t)) 20px 12px;background:rgba(255,253,252,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:900;letter-spacing:.08em;font-size:15px}
.brand small{font-weight:600;letter-spacing:.02em;color:var(--wine2);font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--grey);display:grid;place-items:center;position:relative;cursor:pointer}
.dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--yellow);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center}
.view{padding:4px 18px 24px}
/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + var(--safe-b));background:rgba(255,253,252,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#A69C9D;font-size:11px;font-weight:600;padding:4px 0;position:relative}
.nav a.on{color:var(--wine)}
.nav a .dot{top:0;right:calc(50% - 22px)}
/* cards */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:12px 0}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 20px;color:var(--cream);background:radial-gradient(120% 90% at 100% 0%,#8a2236 0%,transparent 55%),linear-gradient(140deg,var(--wine2),var(--wine) 55%,var(--wine3));box-shadow:0 16px 40px rgba(74,11,24,.28);margin-top:6px}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,0,.18),transparent 70%)}
.hero .hello{font-size:14px;opacity:.8}
.hero h1{margin:4px 0 16px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.bal{display:flex;align-items:flex-end;gap:6px}
.bal b{font-size:44px;line-height:1;font-weight:900;letter-spacing:-.03em}
.bal span{font-size:14px;opacity:.85;margin-bottom:6px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#FFE08A,var(--yellow))}
.hero .meta{display:flex;justify-content:space-between;font-size:12px;opacity:.8}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--yellow);color:var(--ink);letter-spacing:.02em}
/* punch */
.punch{display:flex;align-items:center;gap:16px}
.clock{flex:1}
.clock .t{font-size:34px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .s{font-size:13px;color:var(--mute);margin-top:2px}
.pbtn{width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(150deg,var(--wine2),var(--wine3));box-shadow:0 10px 26px rgba(74,11,24,.35),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s}
.pbtn:active{transform:scale(.96)}
.pbtn.out{background:linear-gradient(150deg,#26305a,var(--navy));box-shadow:0 10px 26px rgba(20,27,51,.35)}
.pbtn small{font-size:11px;font-weight:600;opacity:.8}
.pbtn.busy{opacity:.7;pointer-events:none}
.working{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);background:#E7F4EE;padding:4px 10px;border-radius:99px;margin-top:8px}
.working:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,91,.5)}100%{box-shadow:0 0 0 8px rgba(31,138,91,0)}}
.map{height:170px;border-radius:16px;overflow:hidden;margin-top:14px;background:var(--grey)}
.result{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
/* list rows */
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 4px}
.sec h3{margin:0;font-size:17px;font-weight:800}
.sec a{font-size:13px;color:var(--mute);text-decoration:none}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:700;font-size:15px}
.row .t2{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.c-진행중{background:#FFF4D6;color:#8A5A00}.c-승인완료{background:#E7F4EE;color:var(--ok)}.c-반려{background:#FBE6E8;color:var(--bad)}.c-취소{background:var(--grey);color:var(--mute)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.tile{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--rose-l);color:var(--wine);flex:none}
.banner{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px;margin:12px 0;text-decoration:none}
.banner b{font-size:15px}.banner span{font-size:12.5px;opacity:.75}
.banner .go{margin-left:auto;background:var(--yellow);color:var(--ink);font-weight:800;font-size:12px;padding:6px 10px;border-radius:99px}
/* forms */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--grey);border-radius:14px;padding:4px;gap:4px;margin:8px 0 16px}
.seg button{border:0;background:transparent;padding:11px;border-radius:11px;font-weight:700;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--wine);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;min-height:84px}
.type b{display:block;font-size:15px}
.type small{display:block;color:var(--mute);font-size:12px;margin-top:4px;line-height:1.35}
.type.on{border-color:var(--wine);background:#FFF7F6;box-shadow:0 0 0 3px rgba(74,11,24,.08)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:16px 2px 6px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--wine)}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.stepper b{font-size:22px;min-width:64px;text-align:center}
.policy{background:#FBF6F4;border:1px solid #F0E3DF;border-radius:16px;padding:14px 16px;margin-top:16px;font-size:13.5px;line-height:1.6}
.policy h4{margin:0 0 6px;font-size:14px;color:var(--wine)}
.policy a{color:var(--wine);font-weight:800}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--wine);margin-top:1px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;background:var(--wine);color:var(--cream);margin-top:18px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--grey);color:var(--ink)}
.btn.navy{background:var(--navy)}
.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #F2C9CE}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.warn{background:#FFF7E0;color:#7A5200;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
/* approval line */
.line{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none}
.line::-webkit-scrollbar{display:none}
.ln{display:flex;flex-direction:column;align-items:center;min-width:66px;text-align:center;position:relative}
.ln .ava{width:42px;height:42px;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.ln .nm{font-size:12.5px;font-weight:700;margin-top:6px}
.ln .rl{font-size:11px;color:var(--mute)}
.ln .st{font-size:10.5px;font-weight:800;margin-top:3px}
.ln.done .ava{box-shadow:0 0 0 2px var(--ok)}
.ln.cur .ava{box-shadow:0 0 0 2px var(--yellow);animation:ring 1.8s infinite}
.ln.rej .ava{box-shadow:0 0 0 2px var(--bad)}
.ln.rep .ava{opacity:.55}
@keyframes ring{50%{box-shadow:0 0 0 5px rgba(255,193,0,.35)}}
.arrow{flex:none;width:18px;height:2px;background:var(--line);margin-top:21px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:9px 10px;font-size:14.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600;word-break:break-all}
.hist{border-left:2px solid var(--line);margin:6px 0 0 8px;padding-left:16px}
.hist>div{position:relative;padding:6px 0;font-size:13.5px}
.hist>div:before{content:"";position:absolute;left:-22px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--rose)}
.hist small{color:var(--mute)}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.calh b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11.5px;color:var(--mute);text-align:center;padding:4px 0;font-weight:700}
.cal .d{background:#fff;border-radius:12px;min-height:62px;padding:5px 4px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer}
.cal .d.x{background:transparent;box-shadow:none}
.cal .d.today{outline:2px solid var(--wine)}
.cal .d .n{font-weight:700;margin-left:2px}
.cal .d.sun .n{color:var(--bad)}.cal .d.sat .n{color:var(--blue)}
.cal .p{display:block;margin-top:3px;font-size:10.5px;font-weight:700;padding:1px 4px;border-radius:5px;background:var(--rose-l);color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .p.pend{background:#FFF4D6;color:#8A5A00}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(14,14,14,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--cream);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + var(--safe-b));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:#DDD3D1;margin:0 auto 12px}
.sheet h2{margin:4px 0 6px;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
/* toast & loading */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .2s;max-width:90%;text-align:center}
.sk{background:linear-gradient(90deg,#f1ecea,#faf7f6,#f1ecea);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:26px 0}
.test{background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;text-align:center;padding:6px;letter-spacing:.02em}
/* login */
.login{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:calc(40px + var(--safe-t)) 26px calc(30px + var(--safe-b));background:radial-gradient(120% 70% at 100% 0%,#8a2236 0%,transparent 60%),linear-gradient(160deg,var(--wine2),var(--wine) 50%,var(--wine3));color:var(--cream)}
.login h1{font-size:34px;line-height:1.2;margin:18px 0 10px;font-weight:900;letter-spacing:-.03em}
.login p{opacity:.8;font-size:15px;line-height:1.6;margin:0}
.login .in{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.login .in::placeholder{color:rgba(255,255,255,.55)}
.login .btn{background:var(--cream);color:var(--wine)}
.login .slogan{font-size:12px;letter-spacing:.12em;opacity:.6;text-align:center;margin-top:18px}
.otp{letter-spacing:12px;text-align:center;font-size:26px!important;font-weight:800}
.wm{font-weight:900;letter-spacing:.14em;font-size:14px}
</style>
</head>

<script>
/* ════════════ config ════════════ */
const API = 'https://script.google.com/macros/s/AKfycbzQac5fduY9sPhRXr9-nrvq0jV2ghsrJhug7b6DnSoLVPbv5V8Ays2eGZRPr202BtH8cQ/exec';
const TYPES = [
  {g:'연차',k:'연차',label:'연차',sub:'1일 단위 · 유급',ic:'sun',pol:'입사 1년 미만은 한 달 개근 시 1일(최대 11일), 1년 이상은 15일(2년마다 +1일, 최대 25일). 입사일 기준으로 관리해요.',docs:''},

  {g:'연차',k:'오후 반차',label:'오후 반차',sub:'0.5일 · 4시간',half:'오후',ic:'half',pol:'반차는 0.5일(4시간)이에요. 먼저 점장님과 스케줄을 맞춰 주세요.',docs:''},

  {g:'휴가',k:'보건휴가',label:'보건휴가',sub:'무급 · 월 1일',ic:'moon',pol:'여성 근로자는 매월 1일 사용할 수 있어요 (무급, 이월 불가).',docs:''},
  {g:'휴가',k:'예비군·민방위',label:'예비군·민방위',sub:'유급 공가',ic:'flag',pol:'훈련·교육 시간은 유급 공가로 인정돼요. 남은 근무시간은 복귀하거나 연차로 쓸 수 있어요.',docs:'교육 필증, 이수 증명서 (통지서만으로는 부족)'},

  {g:'휴가',k:'배우자 출산휴가',label:'배우자 출산휴가',sub:'유급 · 20일',ic:'baby',pol:'출산일부터 120일 이내 총 20일, 최대 3회 나눠서 쓸 수 있어요.',docs:'출생증명서, 가족관계증명서'},
  {g:'휴가',k:'가족돌봄휴가',label:'가족돌봄휴가',sub:'무급 · 연 10일',ic:'home',pol:'가족의 질병·사고·노령·양육으로 돌봄이 필요할 때 연 최대 10일, 1일 단위로 사용해요.',docs:'가족관계증명서, 진단서 등'},

      <button class="btn" id="rt">다시 시도</button><button class="btn ghost" id="nl">위치 없이 기록</button>`,m=>{

function drawMap(lat,lng,near){
  const go=()=>{if(!window.L||!$('#mp'))return;S.map=L.map('mp',{zoomControl:false,attributionControl:false}).setView([lat,lng],16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(S.map);
    const b=S.data.branches.find(x=>x.name===near);
    if(b&&b.lat){L.circle([b.lat,b.lng],{radius:b.radius,color:'#4A0B18',weight:1.5,fillColor:'#C99A9E',fillOpacity:.18}).addTo(S.map);
      S.map.fitBounds(L.latLngBounds([[lat,lng],[b.lat,b.lng]]).pad(.6))}
    L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#4A0B18',fillOpacity:1}).addTo(S.map)};
  window.L?go():setTimeout(go,800);
}

async function vCal(v,m){
  const now=new Date(); m=m||`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const [y,mo]=m.split('-').map(Number);
  const prev=ymd(new Date(y,mo-2,1)).slice(0,7), next=ymd(new Date(y,mo,1)).slice(0,7);
  v.innerHTML=`<div class="calh"><a href="#/cal/${prev}" style="padding:8px">${I('back',20)}</a><b>${y}년 ${mo}월</b><a href="#/cal/${next}" style="padding:8px;transform:scaleX(-1)">${I('back',20)}</a></div><div class="sk" style="height:360px"></div>`;
  let j;try{j=await api('calendar',{month:m})}catch(e){return}
  const first=new Date(y,mo-1,1).getDay(), last=new Date(y,mo,0).getDate(), today=ymd(now);
  let cells=WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++)cells+=`<div class="d x"></div>`;
  for(let d=1;d<=last;d++){const ds=`${m}-${pad(d)}`;const its=j.items.filter(i=>i.start<=ds&&i.end>=ds);const dw=(first+d-1)%7;
    cells+=`<div class="d ${ds===today?'today':''} ${dw===0?'sun':dw===6?'sat':''}" data-d="${ds}"><span class="n">${d}</span>${its.slice(0,2).map(i=>`<span class="p ${i.status==='진행중'?'pend':''}">${esc(i.name)}</span>`).join('')}${its.length>2?`<span class="p" style="background:none;color:var(--mute)">+${its.length-2}</span>`:''}</div>`}
  v.innerHTML=`<div class="calh"><a href="#/cal/${prev}" style="padding:8px">${I('back',20)}</a><b>${y}년 ${mo}월</b><a href="#/cal/${next}" style="padding:8px;transform:scaleX(-1)">${I('back',20)}</a></div>
   <div style="font-size:12.5px;color:var(--mute);margin:-4px 2px 10px">${esc(j.scope)} · <span class="p" style="display:inline;background:var(--rose-l);color:var(--wine);padding:1px 6px;border-radius:5px;font-weight:700">확정</span> <span class="p" style="display:inline;background:#FFF4D6;color:#8A5A00;padding:1px 6px;border-radius:5px;font-weight:700">결재중</span></div>
   <div class="cal">${cells}</div><div id="dl"></div>`;
  v.querySelectorAll('.d[data-d]').forEach(c=>c.onclick=()=>{const ds=c.dataset.d;const its=j.items.filter(i=>i.start<=ds&&i.end>=ds);
    $('#dl').innerHTML=`<div class="sec"><h3>${fmtDay(ds)}</h3></div><div class="card" style="padding:4px 18px">${its.length?its.map(i=>`<div class="row" style="cursor:default">${ava(i.name,'직원',34)}<div class="main"><div class="t1">${esc(i.name)} <span style="color:var(--mute);font-weight:500;font-size:12.5px">${esc(i.branch)}</span></div><div class="t2">${esc(i.type)}${i.half?' · '+esc(i.half):''}</div></div><span class="chip c-${i.status}">${i.status==='진행중'?'결재중':'확정'}</span></div>`).join(''):'<div class="empty">휴가자가 없어요</div>'}</div>`});
}
/* ════════════ MORE ════════════ */
function vMore(v){
  const d=S.data, me=d.me;
  v.innerHTML=`<div class="card" style="display:flex;gap:14px;align-items:center;margin-top:12px">${ava(me.name,me.role,54)}<div><div style="font-size:19px;font-weight:800">${esc(me.name)}</div><div style="color:var(--mute);font-size:13.5px">${esc(me.branch)} · ${esc(me.role)} · ${esc(me.email)}</div>${me.hire?`<div style="color:var(--mute);font-size:12.5px;margin-top:2px">입사일 ${esc(me.hire)}</div>`:''}</div></div>
   <div class="card" style="padding:4px 18px">
    <a class="row" href="#/att" style="text-decoration:none">${I('clock')}<div class="main"><div class="t1">내 출퇴근 기록</div><div class="t2">최근 7일</div></div></a>
    <a class="row" href="${esc(d.policyUrl)}" target="_blank" rel="noopener" style="text-decoration:none">${I('book')}<div class="main"><div class="t1">휴가 및 휴직 가이드</div><div class="t2">Notion 규정 전문</div></div></a>
    <div class="row" id="a2h">${I('phone')}<div class="main"><div class="t1">홈 화면에 추가하기</div><div class="t2">앱처럼 한 번에 열기</div></div></div>
    ${d.canAdmin?`<a class="row" href="#/admin" style="text-decoration:none">${I('team')}<div class="main"><div class="t1">직원 관리</div><div class="t2">가입 승인 · 입사일 · 역할</div></div>${d.pendingUsers?`<span class="chip c-진행중">${d.pendingUsers}</span>`:''}</a>`:''}
    ${d.canImpersonate?`<div class="row" id="imp">${I('eye')}<div class="main"><div class="t1">다른 직원으로 보기</div><div class="t2">테스트 모드 전용 · 결재 흐름 확인</div></div></div>`:''}
    <div class="row" onclick="logout()">${I('out')}<div class="main"><div class="t1">로그아웃</div></div></div>
   </div>
   <div style="text-align:center;color:var(--mute);font-size:12px;margin-top:18px;letter-spacing:.1em">wine is second americano</div>`;
  $('#a2h').onclick=()=>openSheet(`<h2>홈 화면에 추가</h2><div style="font-size:14.5px;line-height:1.8"><b>iPhone (Safari)</b><br>아래 공유 버튼 → '홈 화면에 추가'<br><br><b>Android (Chrome)</b><br>오른쪽 위 ⋮ → '홈 화면에 추가' 또는 '앱 설치'</div><button class="btn" onclick="this.closest('.mask').remove()">알겠어요</button>`);
  if(d.canImpersonate) $('#imp').onclick=async()=>{const j=await api('admin.users');
    openSheet(`<h2>누구로 볼까요?</h2><div style="font-size:13px;color:var(--mute);margin-bottom:8px">로그아웃 후 다시 hello@ 로 로그인하면 돌아와요</div>${j.users.filter(u=>u.status==='재직').map(u=>`<div class="row" data-e="${esc(u.email)}">${ava(u.name,u.role,34)}<div class="main"><div class="t1">${esc(u.name)}</div><div class="t2">${esc(u.branch)} · ${esc(u.role)}</div></div></div>`).join('')}`,m=>{
      m.querySelectorAll('[data-e]').forEach(r=>r.onclick=async()=>{const k=await api('admin.impersonate',{email:r.dataset.e});localStorage.setItem('tsbp_admin_token',S.token);S.token=k.token;localStorage.setItem('tsbp_token',k.token);m.remove();location.hash='#/';boot()})})};
}
function vAtt(v){
  const at=S.data.attendance;
  v.innerHTML=`<div class="sec" style="margin-top:8px"><a href="#/more" style="color:var(--ink)">${I('back',20)}</a></div><h2 style="margin:6px 4px 10px;font-size:24px">내 출퇴근 기록</h2>
  <div class="card" style="padding:4px 18px">${at.recent.length?at.recent.map(r=>`<div class="row" style="cursor:default"><div class="tile">${I('clock')}</div><div class="main"><div class="t1">${fmtDay(r.date)}</div><div class="t2">출근 ${esc(r.in||'-')} · 퇴근 ${esc(r.out||'-')}</div></div><b>${r.hours?r.hours.toFixed(1)+'h':''}</b></div>`).join(''):'<div class="empty">아직 기록이 없어요</div>'}</div>
  <div style="font-size:12.5px;color:var(--mute);margin:8px 4px">기록이 틀리면 점장님께 말씀해 주세요. 위치 정보는 관리자만 볼 수 있어요.</div>`;
}
function vNotis(v){
  const n=S.data.notis;
  v.innerHTML=`<div class="sec" style="margin-top:8px"><a href="javascript:history.back()" style="color:var(--ink)">${I('back',20)}</a></div><h2 style="margin:6px 4px 10px;font-size:24px">알림</h2>
  <div class="card" style="padding:4px 18px">${n.length?n.map(x=>`<div class="row" onclick="location.hash='${esc(x.link||'#/')}'">${x.read?'':'<span style="width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none"></span>'}<div class="main"><div class="t1" style="font-size:14.5px">${esc(x.title)}</div><div class="t2" style="white-space:normal">${esc(x.body)}</div><div class="t2" style="font-size:11.5px">${esc(String(x.at).slice(5,16))}</div></div></div>`).join(''):'<div class="empty">새 알림이 없어요</div>'}</div>`;
  if(n.some(x=>!x.read)) api('notis.read').then(()=>{S.data.notis.forEach(x=>x.read=true);shell(true)}).catch(()=>{});
}
async function vAdmin(v){
  v.innerHTML=`<div class="sk" style="height:300px;margin-top:14px"></div>`;
  const j=await api('admin.users');
  const pend=j.users.filter(u=>u.status==='대기'), act=j.users.filter(u=>u.status!=='대기');
  const row=u=>`<div class="row" data-e="${esc(u.email)}">${ava(u.name,u.role,36)}<div class="main"><div class="t1">${esc(u.name)} <span style="color:var(--mute);font-weight:500;font-size:12.5px">${esc(u.branch)} · ${esc(u.role)}</span></div><div class="t2">${u.hire?'입사 '+esc(u.hire):'입사일 미등록'}${u.balance&&u.balance.known?' · 잔여 '+u.balance.remain+'일':''}</div></div>${u.status!=='재직'?`<span class="chip c-${u.status==='대기'?'진행중':'취소'}">${esc(u.status)}</span>`:''}</div>`;
  v.innerHTML=`<div class="sec" style="margin-top:8px"><a href="#/more" style="color:var(--ink)">${I('back',20)}</a></div><h2 style="margin:6px 4px 10px;font-size:24px">직원 관리</h2>
   ${pend.length?`<div class="sec"><h3>가입 요청 ${pend.length}</h3></div><div class="card" style="padding:4px 18px">${pend.map(row).join('')}</div>`:''}
   <div class="sec"><h3>직원 ${act.length}</h3></div><div class="card" style="padding:4px 18px">${act.map(row).join('')}</div>`;
  v.querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>{const u=j.users.find(x=>x.email===r.dataset.e);
    openSheet(`<h2>${esc(u.name)}</h2><div style="color:var(--mute);font-size:13px">${esc(u.email)}</div>
     <label class="f">이름</label><input class="in" id="u_nm" value="${esc(u.name)}">
     <div class="two"><div><label class="f">지점</label><select class="in" id="u_br" ${j.canEditRole?'':'disabled'}>${j.branches.map(b=>`<option ${b===u.branch?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
     <div><label class="f">역할</label><select class="in" id="u_rl" ${j.canEditRole?'':'disabled'}>${['직원','점장','매니저','임원','이사','대표'].map(x=>`<option ${x===u.role?'selected':''}>${x}</option>`).join('')}</select></div></div>
     <div class="two"><div><label class="f">입사일</label><input class="in" type="date" id="u_hd" value="${esc(u.hire||'')}"></div><div><label class="f">연차 조정(±일)</label><input class="in" id="u_adj" inputmode="decimal" value="${esc(u.adj||'')}" placeholder="예) -3"></div></div>
     <label class="f">상태</label><select class="in" id="u_st">${['대기','재직','퇴사'].map(x=>`<option ${x===u.status?'selected':''}>${x}</option>`).join('')}</select>
     <button class="btn" id="u_sv">${u.status==='대기'?'승인하고 저장':'저장'}</button>`,m=>{
      m.querySelector('#u_sv').onclick=async()=>{const st=m.querySelector('#u_st').value;
        const body={email:u.email,name:m.querySelector('#u_nm').value,hire:m.querySelector('#u_hd').value,adj:m.querySelector('#u_adj').value,status:u.status==='대기'&&st==='대기'?'재직':st};
        if(j.canEditRole){body.branch=m.querySelector('#u_br').value;body.role=m.querySelector('#u_rl').value}
        try{await api('admin.saveUser',body);m.remove();toast('저장했어요');await refresh();vAdmin(v)}catch(e){toast(e.message)}}})});
}
/* ════════════ start ════════════ */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
