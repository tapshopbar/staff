<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>탭샵바 지원서 올리기</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4A0B18">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=n32">
<link rel="stylesheet" href="onboard.css?v=ob1">
<style>
.jn{max-width:560px;margin:0 auto;padding-bottom:40px}
.jn-hero{background:linear-gradient(135deg,var(--wine2),var(--wine3));color:#fff;padding:calc(26px + var(--safe-t)) var(--pad) 26px}
.jn-hero .lg{font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.8}
.jn-hero h1{font-size:30px;font-weight:800;letter-spacing:-.05em;line-height:1.15;margin-top:14px}
.jn-hero p{font-size:14.5px;opacity:.82;margin-top:8px;line-height:1.55}
.jn-hero .fs-pv{margin-top:12px}
.jn label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}
.jn label small{font-weight:600;color:var(--mute)}
.jn input[type=text],.jn input[type=tel],.jn input[type=date],.jn select,.jn textarea{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;background:#fff}
.jn textarea{height:auto;min-height:88px;padding:12px 14px}
.jn .chips{display:flex;gap:6px;flex-wrap:wrap}
.jn .chips button{padding:9px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:700}
.jn .chips button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.jn .up{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px dashed #C9C4BE;border-radius:16px;background:#fff;margin-top:6px;cursor:pointer}
.jn .up.ok{border-style:solid;border-color:var(--ok);background:#EAF5EF}
.jn .up b{font-size:14.5px;font-weight:800}
.jn .up span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.jn .up .ph{width:64px;height:64px;border-radius:18px;background:var(--grey);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;color:#B9B2AB}
.jn .up .ph img{width:100%;height:100%;object-fit:cover}
.jn .agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;margin-top:10px}
.jn .agree input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--wine)}
.jn details{margin-top:8px;font-size:12.5px;color:#4a4444;line-height:1.6}
.jn details summary{font-weight:800;color:var(--mute);cursor:pointer}
.jn table{width:100%;border-collapse:collapse;margin-top:6px}
.jn td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.jn td:first-child{width:76px;font-weight:700;color:var(--mute)}
</style>
</head>
<body>
<div class="jn" id="jn"></div>
<script>
(function(){
  const q=new URLSearchParams(location.search), t=q.get('t')||'';
  const demo=t==='DEMO'||!t;
  const job={br:'상암',job:'홀 · 파트타임',dl:'11월 19일(목)'}; // 실제: 토큰으로 서버에서 받아옴
  const S={days:[],cv:null,ph:null};
  const el=document.getElementById('jn');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){
    el.innerHTML=`<section class="jn-hero"><div class="lg">TAP SHOP BAR</div><h1>탭샵바에 지원해 주셔서<br>고마워요</h1><p>${esc(job.br)}점 · ${esc(job.job)}<br>로그인 없이 이 화면에서 이력서를 올리면 끝나요. 5분이면 돼요.</p>${demo?'<span class="fs-pv">미리보기 · 실제로 저장되지 않아요</span>':''}</section>
    <div class="fs-card"><h3>1. 기본 정보</h3>
      <label>이름</label><input type="text" id="nm" placeholder="홍길동">
      <label>휴대폰</label><input type="tel" id="ph" placeholder="010-0000-0000" inputmode="tel">
      <label>생년월일 <small>· 주류 판매 업무라 만 나이 확인이 필요해요</small></label><input type="date" id="bd">
      <label>일할 수 있는 요일</label><div class="chips" id="days">${['월','화','수','목','금','토','일'].map(d=>`<button type="button" data-d="${d}" class="${S.days.includes(d)?'on':''}">${d}</button>`).join('')}</div>
      <label>시간대</label><select id="tm"><option>저녁 (16시~마감)</option><option>낮 (11시~17시)</option><option>시간 상관없어요</option></select>
      <label>시작할 수 있는 날</label><input type="date" id="sd">
    </div>
    <div class="fs-card"><h3>2. 이력서</h3>
      <div class="up ${S.cv?'ok':''}" id="cvUp"><div class="ph">${S.cv?'✓':'+'}</div><div><b>${S.cv?esc(S.cv):'이력서 파일 올리기'}</b><span>PDF · 사진 · 한글 파일 모두 돼요 (10MB까지)</span></div></div>
      <input type="file" id="cvF" accept=".pdf,.hwp,.hwpx,.doc,.docx,image/*" style="display:none">
      <label>이력서가 없으면 짧게 적어 주세요 <small>· 선택</small></label><textarea id="cvT" placeholder="예) 와인바 홀 1년, 카페 8개월. 보건증 있어요."></textarea>
    </div>
    <div class="fs-card"><h3>3. 사진 <span class="k">· 선택</span></h3>
      <div class="up ${S.ph?'ok':''}" id="phUp"><div class="ph">${S.ph?`<img src="${S.ph}" alt="">`:'☺'}</div><div><b>${S.ph?'사진 올렸어요':'얼굴 사진 올리기'}</b><span>안 올려도 불이익은 없어요. 면접 때 본인 확인과, 합격하면 직원 프로필에 써요. 외모는 평가하지 않아요.</span></div></div>
      <input type="file" id="phF" accept="image/*" style="display:none">
    </div>
    <div class="fs-card"><h3>4. 동의</h3>
      <div class="agree"><input type="checkbox" id="a1"><span><b>[필수]</b> 채용 진행을 위한 개인정보 수집 · 이용에 동의해요</span></div>
      <details><summary>자세히 보기</summary><table>
        <tr><td>항목</td><td>이름, 휴대폰, 생년월일, 근무 가능 시간, 이력서 내용 · 파일, 사진(선택)</td></tr>
        <tr><td>목적</td><td>서류 검토, 면접 연락, 채용 결과 안내</td></tr>
        <tr><td>보관</td><td>채용 결과가 나온 뒤 30일. 그 뒤 5일 안에 지워요. 합격하면 인사 기록으로 옮겨요.</td></tr>
        <tr><td>거부</td><td>동의하지 않을 수 있지만, 그러면 지원 접수가 어려워요.</td></tr></table></details>
      <details><summary>채용서류 반환 안내</summary><p>이 화면으로 낸 서류는 전자 방식 제출이라 법상 반환 대상은 아니에요. 대신 채용 결과가 나온 뒤 30일이 지나면 모두 지워요. 그 전에 지워 달라고 하면 바로 지워 드려요.</p></details>
      <div class="agree"><input type="checkbox" id="a2"><span>[선택] 이번에 함께하지 못하면, 다음 채용 때 연락받을게요 (6개월 보관)</span></div>
      <p class="fs-note" style="padding:10px 0 0">키 · 몸무게 · 출신지 · 결혼 여부 · 가족 정보는 묻지 않아요.</p>
    </div>
    <div class="fs-foot"><button class="pill wine full" id="sub">지원서 보내기</button><p class="fs-note" style="padding:0;text-align:center">${esc(job.dl)}까지 · 결과는 휴대폰 문자로 알려 드려요</p></div>`;
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;S.days=S.days.includes(d)?S.days.filter(x=>x!==d):[...S.days,d];b.classList.toggle('on')});
    const cvF=el.querySelector('#cvF'),phF=el.querySelector('#phF');
    el.querySelector('#cvUp').onclick=()=>cvF.click();
    el.querySelector('#phUp').onclick=()=>phF.click();
    cvF.onchange=()=>{if(cvF.files[0]){S.cv=cvF.files[0].name;keep();render();restore()}};
    phF.onchange=()=>{const f=phF.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.ph=r.result;keep();render();restore()};r.readAsDataURL(f)};
    el.querySelector('#sub').onclick=()=>{
      const nm=el.querySelector('#nm').value.trim(),ph=el.querySelector('#ph').value.trim();
      if(!nm||!ph)return alert('이름과 휴대폰을 적어 주세요');
      if(!S.cv&&!el.querySelector('#cvT').value.trim())return alert('이력서를 올리거나 짧게 적어 주세요');
      if(!el.querySelector('#a1').checked)return alert('필수 동의에 체크해 주세요');
      el.innerHTML=`<section class="jn-hero"><div class="lg">TAP SHOP BAR</div><h1>지원서를 받았어요,<br>${esc(nm)}님</h1><p>${esc(job.br)}점 점장님이 확인하고 면접 일정을 문자로 알려 드려요.</p>${demo?'<span class="fs-pv">미리보기 · 실제로는 저장 · 발송되지 않았어요</span>':''}</section>
      <div class="fs-card grey"><h3>다음은 이렇게 가요</h3><ul class="fs-next" style="margin:6px 0 0;padding:0"><li><b>1</b>점장님 서류 확인 · 면접 연락</li><li><b>2</b>매장 면접 (30분 안팎)</li><li><b>3</b>본사 최종 확인 후 결과 문자</li><li><b>4</b>합격하면 근로계약 · 직원 앱 초대</li></ul></div>
      <p class="fs-note">wine is second americano</p>`;
    };
  }
  let F={};
  function keep(){['nm','ph','bd','tm','sd','cvT'].forEach(k=>{const x=el.querySelector('#'+k);if(x)F[k]=x.value});['a1','a2'].forEach(k=>{const x=el.querySelector('#'+k);if(x)F[k]=x.checked})}
  function restore(){Object.keys(F).forEach(k=>{const x=el.querySelector('#'+k);if(!x)return;if(x.type==='checkbox')x.checked=F[k];else x.value=F[k]})}
  render();
})();
</script>
</body>
</html>
